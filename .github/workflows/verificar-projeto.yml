name: Verificar estrutura do projeto
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail
          for file in Projeto-Godot/project.godot Projeto-Godot/main.tscn Projeto-Godot/main.gd; do
            test -s "$file" || { echo "Arquivo ausente ou vazio: $file"; exit 1; }
          done
          echo "Arquivos basicos presentes."
      - name: Verificar se ferramentas e executaveis foram ignorados
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.godot|\.ferramentas|logs-geracao|Windows-Atualizado)/|\.(exe|pck|dll|zip)$'; then
            echo 'Erro: arquivos gerados ou ferramentas foram versionados.'
            exit 1
          fi
          echo 'Nenhum executavel ou cache versionado.'
      - name: Validar modularizacao e compatibilidade
        run: python3 tests/verificar_estrutura.py
      - name: Validar modelo GLB e integracao dos goblins
        run: python3 tests/verificar_goblin.py
      - name: Instalar Godot 4.7.2 (Linux headless)
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Testar importacao Godot
        shell: bash
        run: |
          timeout 120 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path Projeto-Godot --editor --import --quit
      - name: Testar execucao curta da cena principal
        shell: bash
        run: |
          timeout 120 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path Projeto-Godot --quit-after 3
      - name: Testar goblin 3D no Godot (headless)
        shell: bash
        run: |
          timeout 90 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path Projeto-Godot --script res://tests/testar_goblin.gd
