name: Compilar jogo Windows e publicar ZIP
# Reexecucao solicitada em 2026-11-22: publicar versao Windows com runners clareira-goblins.

on:
  push:
    branches: [main]
    paths:
      - 'Projeto-Godot/**'
      - '.github/workflows/publicar-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-clareira-windows
  cancel-in-progress: false

jobs:
  windows:
    # Qualquer runner Windows proprio que tenha acesso a este repositorio.
    runs-on: [self-hosted, Windows, X64, clareira-goblins]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Baixar codigo do jogo
        uses: actions/checkout@v4

      - name: Preparar Godot 4.7.2 Windows e export templates
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.7.2'
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"
          $toolsDir = Join-Path $env:RUNNER_TEMP 'clareira-godot'
          $godotExe = Join-Path $toolsDir "Godot_v$version-stable_win64_console.exe"
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          if (-not (Test-Path $godotExe)) {
            $archive = Join-Path $toolsDir 'godot.zip'
            Invoke-WebRequest -Uri "$base/Godot_v$version-stable_win64.exe.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $toolsDir -Force
          }
          if (-not (Test-Path $godotExe)) {
            $godotExe = (Get-ChildItem $toolsDir -Filter '*console*.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $godotExe -or -not (Test-Path $godotExe)) { throw 'Executavel do Godot nao encontrado.' }
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$version.stable"
          $templateExe = Join-Path $templateDir 'windows_release_x86_64.exe'
          if (-not (Test-Path $templateExe)) {
            $templateZip = Join-Path $toolsDir 'templates.zip'
            Invoke-WebRequest -Uri "$base/Godot_v$version-stable_export_templates.tpz" -OutFile $templateZip
            $extractDir = Join-Path $toolsDir 'template-files'
            Expand-Archive -Path $templateZip -DestinationPath $extractDir -Force
            New-Item -ItemType Directory -Path $templateDir -Force | Out-Null
            $files = Get-ChildItem $extractDir -Filter 'windows_*_x86_64.exe' -File -Recurse
            foreach ($file in $files) { Copy-Item $file.FullName (Join-Path $templateDir $file.Name) -Force }
          }
          if (-not (Test-Path $templateExe)) { throw 'Template Windows release nao encontrado.' }
          "GODOT_EXE=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $godotExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot nao iniciou.' }

      - name: Importar recursos e validar scripts
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_EXE --headless --path Projeto-Godot --import 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'clareira-import.log')
          if ($LASTEXITCODE -ne 0) { throw 'Falha na importacao do Godot.' }
          $log = Get-Content (Join-Path $env:RUNNER_TEMP 'clareira-import.log') -Raw
          if ($log -match '(?m)^\s*(SCRIPT ERROR:|ERROR:.*Parse Error)') { throw 'Erro de script na importacao.' }

      - name: Testar modelos do machado e goblins
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'Projeto-Godot/modelos/goblin_npc.glb')) { throw 'GLB dos goblins ausente.' }
          $tests = @(
            @{path='res://tests/test_wood_axe_model.gd'; message='WOOD AXE MODEL OK'},
            @{path='res://tests/test_goblin_npc_model.gd'; message='GOBLIN MODEL OK'},
            @{path='res://tests/test_goblin_skin_v2.gd'; message='SKIN V2 OK'},
            @{path='res://tests/test_goblin_v3.gd'; message='GOBLIN V3 OK'},
            @{path='res://tests/test_goblin_v4.gd'; message='GOBLIN V4 OK'}
          )
          foreach ($test in $tests) {
            Write-Host "Executando $($test.path)"
            $output = & $env:GODOT_EXE --headless --path Projeto-Godot --script $test.path 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0 -or -not $output.Contains($test.message)) {
              throw "Teste falhou: $($test.path)"
            }
          }

      - name: Exportar EXE Windows e gerar ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $exe = Join-Path $dist 'Clareira-dos-Goblins.exe'
          $output = & $env:GODOT_EXE --headless --path Projeto-Godot --export-release 'Windows Desktop' $exe 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw 'Exportacao Windows falhou.' }
          if ((Get-Item $exe).Length -le 0) { throw 'EXE vazio.' }
          if ($output -match '(?m)^\s*(SCRIPT ERROR:|ERROR:.*Parse Error)') { throw 'Erros de script na exportacao.' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Clareira-dos-Goblins.exe" | Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          $env:GITHUB_SHA | Set-Content (Join-Path $dist 'versao-github.txt') -Encoding ascii
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Clareira-dos-Goblins-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe,(Join-Path $dist 'versao-github.txt'),(Join-Path $dist 'SHA256SUMS.txt') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'ZIP da release nao gerado.' }

      - name: Publicar versao pronta na Release do GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI (gh) nao esta instalado no runner Windows.' }
          gh release view jogo-windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create jogo-windows --title 'Clareira dos Goblins - Windows' --notes 'Versao compilada automaticamente da branch main. Baixe o ZIP e extraia antes de jogar.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar Release.' }
          }
          gh release upload jogo-windows 'Clareira-dos-Goblins-Windows.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha no upload da Release.' }
          gh release edit jogo-windows --notes "Build Windows gerado do commit $env:GITHUB_SHA. Baixe o ZIP e extraia antes de jogar."
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar notas da Release.' }
