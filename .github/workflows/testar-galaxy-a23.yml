name: Testar compilacao Android no Galaxy A23
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/testar-galaxy-a23.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: clareira-a23-teste
  cancel-in-progress: false
jobs:
  testar-a23:
    runs-on: [self-hosted, Linux, ARM64, a23]
    timeout-minutes: 75
    steps:
      - name: Diagnosticar runner e ferramentas
        shell: bash
        run: |
          set -eu
          echo "Runner: $RUNNER_NAME"
          uname -a
          test "$(uname -m)" = aarch64
          free -h || true
          df -h .
          for tool in godot godot4 java adb aapt aapt2 apksigner; do
            command -v "$tool" || true
          done
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
      - name: Preparar descompactador ZIP no A23
        shell: bash
        run: |
          set -eu
          if command -v unzip >/dev/null 2>&1; then
            unzip -v | head -5
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            if [ "$(id -u)" = 0 ]; then
              (apt-get update && apt-get install -y --no-install-recommends unzip) || true
            elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              (sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends unzip) || true
            fi
          fi
          if command -v unzip >/dev/null 2>&1; then
            unzip -v | head -5
            exit 0
          fi
          # Fallback sem privilegios: extrair pacote oficial no cache do runner.
          cache="$RUNNER_TOOL_CACHE/clareira-unzip"
          mkdir -p "$cache"
          if [ ! -x "$cache/usr/bin/unzip" ]; then
            if command -v apt-get >/dev/null 2>&1 && command -v dpkg-deb >/dev/null 2>&1; then
              tmp="$(mktemp -d "$RUNNER_TEMP/clareira-unzip-XXXXXX")"
              if (cd "$tmp" && apt-get download unzip && dpkg-deb -x ./unzip_*.deb "$cache"); then
                echo 'Descompactador instalado no cache local.'
              fi
              rm -rf "$tmp"
            fi
          fi
          if [ -x "$cache/usr/bin/unzip" ] && "$cache/usr/bin/unzip" -v >/dev/null 2>&1; then
            echo "$cache/usr/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          # O runner ja possui Node.js para executar actions/checkout.
          # Usar a biblioteca ZIP do Node via um extrator restrito a arquivos normais.
          node_bin="$(command -v node || true)"
          if [ -z "$node_bin" ]; then
            runner_root="$(dirname "$RUNNER_WORKSPACE")/.."
            for candidate in "$runner_root"/externals/node*/bin/node; do
              if [ -x "$candidate" ]; then node_bin="$candidate"; break; fi
            done
          fi
          if [ -z "$node_bin" ]; then
            echo 'Sem permissao para instalar unzip e sem Node.js acessivel.'
            exit 1
          fi
          mkdir -p "$cache/bin"
          cat > "$cache/bin/extract.cjs" <<'JS'
          const fs = require('node:fs'), path = require('node:path'), zlib = require('node:zlib');
          const [archive, target] = process.argv.slice(2);
          const b = fs.readFileSync(archive);
          let e = b.length - 22;
          while (e >= Math.max(0,b.length-65557) && b.readUInt32LE(e)!==0x06054b50) e--;
          if(e<0 || b.readUInt32LE(e)!==0x06054b50) throw Error('ZIP invalido');
          const count=b.readUInt16LE(e+10), root=path.resolve(target);
          let p=b.readUInt32LE(e+16);
          for(let i=0;i<count;i++){
            if(b.readUInt32LE(p)!==0x02014b50) throw Error('Diretorio ZIP invalido');
            const method=b.readUInt16LE(p+10), size=b.readUInt32LE(p+20), expected=b.readUInt32LE(p+24);
            const n=b.readUInt16LE(p+28), x=b.readUInt16LE(p+30), c=b.readUInt16LE(p+32), off=b.readUInt32LE(p+42);
            const name=b.toString('utf8',p+46,p+46+n);
            p+=46+n+x+c;
            const dest=path.resolve(root,name);
            if(!dest.startsWith(root+path.sep)) throw Error('Caminho ZIP inseguro');
            if(name.endsWith('/')) {fs.mkdirSync(dest,{recursive:true});continue;}
            if(b.readUInt32LE(off)!==0x04034b50) throw Error('Cabecalho ZIP invalido');
            const start=off+30+b.readUInt16LE(off+26)+b.readUInt16LE(off+28);
            const data=b.subarray(start,start+size);
            const out=method===0?data:method===8?zlib.inflateRawSync(data,{maxOutputLength:expected||1}):null;
            if(!out||out.length!==expected) throw Error('Arquivo ZIP invalido: '+name);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,out);
          }
          JS
          printf '%s\n' '#!/bin/bash' 'set -eu' "exec \"$node_bin\" \"$cache/bin/extract.cjs\" \"\$2\" \"\$4\"" > "$cache/bin/unzip"
          chmod +x "$cache/bin/unzip"
          echo "$cache/bin" >> "$GITHUB_PATH"
          echo 'Extrator local Node.js preparado para unzip -o arquivo -d destino.'
      - name: Preparar dependencias ARM64 sem administrador
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE/clareira-android-a23"
          native="$cache/native"
          mkdir -p "$native" "$cache/jdk"
          # Instala no cache privado, sem modificar o Ubuntu ou outros runners.
          if [ ! -f "$native/.ready" ]; then
            tmp="$(mktemp -d "$RUNNER_TEMP/clareira-arm64-XXXXXX")"
            trap 'rm -rf "$tmp"' EXIT
            apt-get -s --no-install-recommends install adb libfontconfig1 fonts-dejavu-core > "$tmp/plan"
            cat "$tmp/plan"
            (
              cd "$tmp"
              # Baixar tambem os pacotes principais se ja estiverem no sistema.
              packages="$( { printf '%s\n' adb libfontconfig1 fonts-dejavu-core; awk '/^Inst / {print $2}' plan; } | sort -u)"
              for pkg in $packages; do
                apt-get download "$pkg"
              done
              for pkg in ./*.deb; do dpkg-deb -x "$pkg" "$native"; done
            )
            touch "$native/.ready"
          fi
          libs="$native/usr/lib/aarch64-linux-gnu:$native/usr/lib/aarch64-linux-gnu/android:$native/usr/lib/android-sdk/platform-tools:$native/lib/aarch64-linux-gnu"
          export LD_LIBRARY_PATH="$libs:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          adb_bin="$(find "$native" -type f -name adb -print -quit)"
          if [ -z "$adb_bin" ]; then adb_bin="$(command -v adb || true)"; fi
          test -x "$adb_bin"
          "$adb_bin" version
          mkdir -p "$cache/fontconfig" "$cache/font-cache"
          cat > "$cache/fontconfig/fonts.conf" <<EOF
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig><dir>$native/usr/share/fonts</dir><dir>/usr/share/fonts</dir><cachedir>$cache/font-cache</cachedir></fontconfig>
          EOF
          echo "FONTCONFIG_FILE=$cache/fontconfig/fonts.conf" >> "$GITHUB_ENV"
          if [ ! -x "$cache/jdk/bin/java" ]; then
            archive="$(mktemp "$RUNNER_TEMP/clareira-jdk-XXXXXX.tar.gz")"
            curl -fL --retry 2 --max-time 600 'https://api.adoptium.net/v3/binary/latest/17/ga/linux/aarch64/jdk/hotspot/normal/eclipse' -o "$archive"
            tar -xzf "$archive" -C "$cache/jdk" --strip-components=1
            rm -f "$archive"
          fi
          "$cache/jdk/bin/java" -version
          test -x "$cache/jdk/bin/keytool"
          echo "JAVA_HOME=$cache/jdk" >> "$GITHUB_ENV"
          echo "$cache/jdk/bin" >> "$GITHUB_PATH"
          sdk="$cache/sdk"
          tools="$sdk/build-tools/35.0.1"
          mkdir -p "$sdk/platform-tools" "$tools"
          ln -sfn "$adb_bin" "$sdk/platform-tools/adb"
          # apksigner e Java puro; os binarios x86 do ZIP oficial nao sao usados.
          if [ ! -s "$tools/lib/apksigner.jar" ]; then
            archive="$(mktemp "$RUNNER_TEMP/clareira-apksigner-XXXXXX.zip")"
            curl -fL --retry 2 --max-time 600 'https://dl.google.com/android/repository/build-tools_r35.0.1_linux.zip' -o "$archive"
            mkdir -p "$tools/lib"
            unzip -p "$archive" '*/lib/apksigner.jar' > "$tools/lib/apksigner.jar.tmp"
            test -s "$tools/lib/apksigner.jar.tmp"
            mv "$tools/lib/apksigner.jar.tmp" "$tools/lib/apksigner.jar"
            rm -f "$archive"
          fi
          cat > "$tools/apksigner" <<'EOF'
          #!/bin/bash
          set -eu
          exec "$JAVA_HOME/bin/java" -jar "$(dirname "$0")/lib/apksigner.jar" "$@"
          EOF
          chmod +x "$tools/apksigner"
          JAVA_HOME="$cache/jdk" "$tools/apksigner" --version
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "A23_APKSIGNER=$tools/apksigner" >> "$GITHUB_ENV"
          echo "A23_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Preparar templates Godot e chave local de teste
        shell: bash
        run: |
          set -euo pipefail
          # Configuracao separada, sem alterar os dados do servidor de jogo.
          config="$A23_CACHE/config"
          data="$A23_CACHE/data"
          templates="$data/godot/export_templates/4.7.2.stable"
          mkdir -p "$config/godot" "$templates"
          if [ ! -s "$templates/android_debug.apk" ] || [ ! -s "$templates/android_release.apk" ]; then
            archive="$(mktemp "$RUNNER_TEMP/clareira-templates-XXXXXX.tpz")"
            curl -fL --retry 2 --max-time 1500 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz' -o "$archive"
            unzip -j -o "$archive" '*/android_debug.apk' '*/android_release.apk' -d "$templates"
            rm -f "$archive"
          fi
          test -s "$templates/android_debug.apk"
          test -s "$templates/android_release.apk"
          key="$A23_CACHE/debug.keystore"
          if [ ! -s "$key" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000 -storetype PKCS12
          fi
          cat > "$config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$key"
          EOF
          echo "XDG_CONFIG_HOME=$config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$data" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$key" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo 'JDK, adb, apksigner e templates Android preparados.'
      - uses: actions/checkout@v4
        with:
          ref: ad36f73ba9df1c1f03d17d77f20fd997b287f250
          persist-credentials: false
      - name: Validar e tentar exportar APK local
        shell: bash
        run: |
          set -eu
          git log -1 --oneline
          godot_bin="${GODOT_EXE:-}"
          if [ -z "$godot_bin" ]; then
            godot_bin="$(command -v godot4 || command -v godot || true)"
          fi
          if [ -z "$godot_bin" ]; then
            cache="$RUNNER_TOOL_CACHE/clareira-godot-4.7.2-arm64"
            mkdir -p "$cache"
            godot_bin="$cache/Godot_v4.7.2-stable_linux.arm64"
            if [ ! -x "$godot_bin" ]; then
              archive="$(mktemp "$RUNNER_TEMP/godot-a23-XXXXXX.zip")"
              curl -fL --retry 2 --max-time 300 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.arm64.zip' -o "$archive"
              if command -v unzip >/dev/null 2>&1; then
                unzip -o "$archive" -d "$cache"
              elif command -v python3 >/dev/null 2>&1; then
                python3 -m zipfile -e "$archive" "$cache"
              elif command -v busybox >/dev/null 2>&1; then
                busybox unzip -o "$archive" -d "$cache"
              else
                echo 'Nenhum extrator ZIP disponivel (unzip, python3 ou busybox).'
                exit 1
              fi
              rm -f "$archive"
              chmod +x "$godot_bin"
            fi
          fi
          "$godot_bin" --version
          "$godot_bin" --version | grep -q '^4\.7\.2' || { echo 'Godot 4.7.2 requerido para reproduzir a compilacao oficial'; exit 1; }
          log="$RUNNER_TEMP/clareira-a23-import.log"
          "$godot_bin" --headless --path Projeto-Godot --import > "$log" 2>&1 || { tail -100 "$log"; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error' "$log"; then exit 1; fi
          for script in res://mobile_controls.gd res://main.gd res://medieval_main_menu.gd res://game_updater.gd; do
            "$godot_bin" --headless --path Projeto-Godot --check-only --script "$script"
          done
          echo 'Importacao e validacao de scripts concluídas.'
          apk="$RUNNER_TEMP/Clareira-A23-teste-${GITHUB_RUN_ID}.apk"
          log="$RUNNER_TEMP/clareira-a23-export.log"
          "$godot_bin" --headless --path Projeto-Godot --export-debug 'Android LAN' "$apk" > "$log" 2>&1 || { tail -100 "$log"; echo 'Exportacao local falhou; verificar SDK Java e templates Android compativeis com ARM64.'; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error' "$log"; then exit 1; fi
          test -s "$apk"
          ls -lh "$apk"
          "$A23_APKSIGNER" verify --verbose "$apk"
          sha256sum "$apk"
          echo 'APK local gerado. Nenhuma release alterada.'
