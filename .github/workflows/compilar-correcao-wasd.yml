name: Compilar Clareira dos Goblins - Windows LAN
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projeto-Godot/main.gd'
      - 'Projeto-Godot/tests/**'
      - 'Projeto-Godot/landscape_terrain.gd'
      - 'Projeto-Godot/tree_fall_sound.gd'
      - '.github/workflows/teste-controles-paisagem.yml'
      - 'ferramentas/Correcao-WASD/**'
      - '.github/workflows/compilar-correcao-wasd.yml'
jobs:
  patch-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar jogo
        uses: actions/checkout@v4
      - name: Baixar Godot 4.7.2 oficial
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path temp,dist | Out-Null
          curl.exe -fLsS --retry 4 -o temp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          if ($LASTEXITCODE -ne 0) { throw 'Falha download Godot' }
          Expand-Archive -LiteralPath temp/godot.zip -DestinationPath temp/Godot -Force
          $exe = Get-ChildItem temp/Godot -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse -File | Select-Object -First 1
          if (!$exe) { throw 'Godot nao encontrado' }
          Copy-Item $exe.FullName -Destination temp/Godot.exe
      - name: Importar projeto e validar scripts
        shell: pwsh
        run: |
          & ./temp/Godot.exe --headless --path Projeto-Godot --import 2>&1 | Tee-Object -FilePath temp/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Falha de importacao' }
          $errors = Select-String -Path temp/import.log -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script' -CaseSensitive:$false
          if ($errors) { $errors | Select-Object -First 8 | ForEach-Object { Write-Host $_.Line }; throw 'Erro de script na importacao' }
          # Testa fisica da malha e camera para impedir publicar terrain quebrado.
          & ./temp/Godot.exe --headless --path Projeto-Godot --script res://tests/test_terrain_physics.gd 2>&1 | Tee-Object -FilePath temp/fisica.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path temp/fisica.log -SimpleMatch 'TERRAIN PHYSICS OK')) { throw 'Falha fisica de player/NPC' }
          & ./temp/Godot.exe --headless --path Projeto-Godot --script res://tests/test_terrain_visual.gd 2>&1 | Tee-Object -FilePath temp/visual.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path temp/visual.log -SimpleMatch 'TERRAIN RENDERING OK')) { throw 'Falha teste de terreno visual/camera' }
          & ./temp/Godot.exe --headless --path Projeto-Godot --script res://tests/test_forest_gameplay.gd 2>&1 | Tee-Object -FilePath temp/floresta.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path temp/floresta.log -SimpleMatch 'FOREST GAMEPLAY OK')) { throw 'Falha teste de arvore/pa/som/lobos' }
          if (Select-String -Path temp/floresta.log -Pattern 'SCRIPT ERROR|FOREST GAMEPLAY FAIL' -CaseSensitive:$false) { throw 'Erros na floresta' }
          & ./temp/Godot.exe --headless --path Projeto-Godot --script res://tests/test_build_levels.gd 2>&1 | Tee-Object -FilePath temp/construcao.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path temp/construcao.log -SimpleMatch 'BUILD LEVELS OK')) { throw 'Falha teste de paredes/piso-teto 3 andares' }
          if (Select-String -Path temp/construcao.log -Pattern 'SCRIPT ERROR|BUILD LEVELS FAIL' -CaseSensitive:$false) { throw 'Erros no sistema de construcao' }
          & ./temp/Godot.exe --headless --path Projeto-Godot --script res://tests/test_door_floor_entry.gd 2>&1 | Tee-Object -FilePath temp/entrada-piso.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path temp/entrada-piso.log -SimpleMatch 'DOOR FLOOR TEST OK')) { throw 'Falha entrada por porta, snap ou teto' }
          if (Select-String -Path temp/entrada-piso.log -Pattern 'SCRIPT ERROR|DOOR FLOOR FAIL' -CaseSensitive:$false) { throw 'Erro na entrada do piso' }
      - name: Testar multiplayer LAN real em dois processos
        shell: pwsh
        run: |
          $godot = (Resolve-Path './temp/Godot.exe').Path
          $server = Start-Process -FilePath $godot -ArgumentList '--headless','--path','Projeto-Godot','--script','res://tests/test_multiplayer_udp.gd','--','--mode=host' -PassThru -RedirectStandardOutput 'temp/rede-host.log' -RedirectStandardError 'temp/rede-host-err.log'
          try {
            Start-Sleep -Seconds 4
            if ($server.HasExited) { Get-Content temp/rede-host.log,temp/rede-host-err.log; throw 'Anfitriao saiu antes da conexao' }
            & $godot --headless --path Projeto-Godot --script res://tests/test_multiplayer_udp.gd -- --mode=client 2>&1 | Tee-Object -FilePath 'temp/rede-client.log'
            if ($LASTEXITCODE -ne 0) { throw 'Cliente multiplayer falhou' }
            if (!(Select-String -Path temp/rede-client.log -SimpleMatch 'NET MULTIPLAYER CLIENT OK')) { throw 'Convidado nao confirmou mundo compartilhado' }
            if (!$server.WaitForExit(40000)) { throw 'Anfitriao nao confirmou mundo compartilhado' }
            if ($server.ExitCode -ne 0) { throw 'Anfitriao multiplayer falhou' }
            if (!(Select-String -Path temp/rede-host.log -SimpleMatch 'NET MULTIPLAYER HOST OK')) { throw 'Anfitriao nao confirmou colocacao compartilhada' }
            Get-Content temp/rede-host.log -Tail 20
          } finally {
            if (!$server.HasExited) { $server.Kill() }
          }
      - name: Preparar templates exportacao
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 4 -o temp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          if ($LASTEXITCODE -ne 0) { throw 'Falha download templates' }
          Add-Type -AssemblyName System.IO.Compression
          $dest = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path temp/templates.tpz).Path)
          try {
            foreach ($name in @('windows_release_x86_64.exe','windows_debug_x86_64.exe','version.txt')) {
              $entry = $z.Entries | Where-Object { $_.FullName -eq ('templates/' + $name) } | Select-Object -First 1
              if (!$entry) { throw ('Template nao encontrado: ' + $name) }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path $dest $name),$true)
            }
          } finally { $z.Dispose() }
      - name: Exportar jogo Windows
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path dist).Path 'Clareira-dos-Goblins.exe'
          & ./temp/Godot.exe --headless --path Projeto-Godot --export-release 'Windows Desktop' $exe 2>&1 | Tee-Object -FilePath temp/export.log
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe)) { throw 'Falha exportar EXE' }
      - name: Testar executavel exportado
        shell: pwsh
        run: |
          $path = (Resolve-Path dist/Clareira-dos-Goblins.exe).Path
          $log = Join-Path (Resolve-Path temp).Path 'teste-exe.log'
          & $path --headless --quit-after 90 --log-file $log 2>&1 | Tee-Object -FilePath temp/teste-console.log
          if ($LASTEXITCODE -ne 0) { throw 'Jogo exportado saiu com erro' }
          $bad = Select-String -Path $log,temp/teste-console.log -Pattern 'SCRIPT ERROR|ERROR:|Invalid access|FATAL|Node not found' -CaseSensitive:$false
          if ($bad) { $bad | Select-Object -First 8 | ForEach-Object { Write-Host $_.Line }; throw 'Erros na execucao do EXE' }
      - name: Incluir instalador de correcao
        shell: pwsh
        run: |
          Copy-Item ferramentas/Correcao-WASD/INSTALAR-CORRECAO.cmd dist/
          Copy-Item ferramentas/Correcao-WASD/INSTALAR-CORRECAO.ps1 dist/
          Copy-Item ferramentas/Correcao-WASD/LEIA-ME.txt dist/
          Copy-Item ferramentas/Correcao-WASD/INSTRUCOES-LAN.txt dist/
      - name: Empacotar e publicar versao LAN no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path (Resolve-Path temp).Path 'Clareira-dos-Goblins-LAN-Windows.zip'
          Compress-Archive -Path dist/* -DestinationPath $archive -CompressionLevel Optimal -Force
          if (!(Test-Path $archive)) { throw 'Falha criando ZIP LAN' }
          $tag = 'lan-teste'
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Clareira dos Goblins - LAN (teste)' --notes 'Windows LAN, 1 anfitriao + ate 7 convidados. Controles, construcoes e mapa compartilhados. Consulte INSTRUCOES-LAN.txt no ZIP.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar ZIP no GitHub Releases' }
          Write-Host ('Versao LAN: https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/tag/' + $tag)
      - name: Disponibilizar patch
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Clareira-Correcao-WASD-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
