name: Benchmark Android - A23 e servidor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/benchmark-android.yml']
permissions:
  contents: read
concurrency:
  group: clareira-benchmark-android
  cancel-in-progress: false
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: A23
            labels: [self-hosted, Linux, ARM64, a23]
          - device: Servidor
            labels: [self-hosted, Windows, X64, clareira-goblins]
    name: Benchmark ${{ matrix.device }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Preparar somente ferramentas (fora da medicao)
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          if [ "$RUNNER_OS" = Linux ]; then
            test "$RUNNER_NAME" = Galaxy-A23-Runner
            c="$RUNNER_TOOL_CACHE/clareira-android-a23"
            g="$RUNNER_TOOL_CACHE/clareira-godot-4.7.2-arm64/Godot_v4.7.2-stable_linux.arm64"
            test -x "$g" || g="$(command -v godot4 || command -v godot)"
            test -x "$g"
            test -s "$c/data/godot/export_templates/4.7.2.stable/android_debug.apk"
            test -s "$c/debug.keystore"
            test -x "$c/jdk/bin/java"
            test -x "$c/sdk/build-tools/35.0.1/apksigner"
            {
              echo "BENCH_GODOT=$g"
              echo "BENCH_SIGNER=$c/sdk/build-tools/35.0.1/apksigner"
              echo "JAVA_HOME=$c/jdk"
              echo "ANDROID_HOME=$c/sdk"
              echo "ANDROID_SDK_ROOT=$c/sdk"
              echo "XDG_CONFIG_HOME=$c/config"
              echo "XDG_DATA_HOME=$c/data"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$c/debug.keystore"
              echo "FONTCONFIG_FILE=$c/fontconfig/fonts.conf"
              echo "LD_LIBRARY_PATH=$c/native/usr/lib/aarch64-linux-gnu:$c/native/usr/lib/aarch64-linux-gnu/android:$c/native/usr/lib/android-sdk/platform-tools:$c/native/lib/aarch64-linux-gnu"
            } >> "$GITHUB_ENV"
          else
            case "$RUNNER_NAME" in Clareira-Servidor-Cleber-01|Clareira-Servidor-Cleber-02) ;; *) echo 'Runner nao autorizado para benchmark'; exit 1;; esac
            cache="$(cygpath -u "$RUNNER_TOOL_CACHE")"
            sdk="$cache/ClareiraAndroidSDK"
            j="$(find "$cache/Java_Temurin-Hotspot_jdk" -type f -iname java.exe | head -n 1)"
            test -n "$j"
            j="$(dirname "$(dirname "$j")")"
            test -f "$sdk/build-tools/35.0.1/apksigner.bat"
            r="$cache/clareira-benchmark-4.7.2"
            mkdir -p "$r"
            g="$r/Godot_v4.7.2-stable_win64_console.exe"
            if [ ! -f "$g" ]; then
              old="$(cygpath -u "$RUNNER_TEMP")/clareira-android-4.7.2"
              shared="/c/ProgramData/ClareiraGodot/4.7.2"
              for src in "$old" "$shared"; do
                if [ -f "$src/Godot_v4.7.2-stable_win64_console.exe" ] && [ -f "$src/Godot_v4.7.2-stable_win64.exe" ]; then
                  cp "$src"/Godot_v4.7.2-stable_win64*.exe "$r/"
                  break
                fi
              done
              if [ ! -f "$g" ]; then
                curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip -o "$r/editor.zip"
                unzip -o "$r/editor.zip" -d "$r"
              fi
            fi
            touch "$r/_sc_"
            d="$r/editor_data"
            t="$d/export_templates/4.7.2.stable"
            mkdir -p "$t"
            if [ ! -s "$t/android_debug.apk" ]; then
              old="$(cygpath -u "$RUNNER_TEMP")/clareira-android-4.7.2/editor_data/export_templates/4.7.2.stable"
              if [ -s "$old/android_debug.apk" ]; then
                cp "$old"/android_*.apk "$t/"
              else
                curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$r/templates.tpz"
                unzip -jo "$r/templates.tpz" '*/android_debug.apk' '*/android_release.apk' -d "$t"
              fi
            fi
            key="$r/debug.keystore"
            if [ ! -s "$key" ]; then
              "$j/bin/keytool.exe" -genkeypair -keystore "$(cygpath -m "$key")" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000 -storetype PKCS12
            fi
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$(cygpath -m "$j")" "$(cygpath -m "$sdk")" "$(cygpath -m "$key")" > "$d/editor_settings-4.7.tres"
            {
              echo "BENCH_GODOT=$g"
              echo "BENCH_SIGNER=$sdk/build-tools/35.0.1/apksigner.bat"
              echo "JAVA_HOME=$(cygpath -m "$j")"
              echo "ANDROID_HOME=$(cygpath -m "$sdk")"
              echo "ANDROID_SDK_ROOT=$(cygpath -m "$sdk")"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$(cygpath -m "$key")"
            } >> "$GITHUB_ENV"
          fi
          "$g" --version | grep '^4\.7\.2'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Iniciar cronometro antes do checkout
        run: |
          echo "BENCH_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ad36f73ba9df1c1f03d17d77f20fd997b287f250
          clean: true
          persist-credentials: false
      - name: Medir importacao, validacao, exportacao e verificacao
        run: |
          set -euo pipefail
          start=$(date +%s)
          checkout=$((start-BENCH_START))
          git rev-parse HEAD
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then temp="$(cygpath -u "$temp")"; fi
          apk="$temp/benchmark-$GITHUB_RUN_ID-$RUNNER_NAME.apk"
          # checkout limpo remove caches ignorados; nao reutilizar importacoes.
          test ! -d Projeto-Godot/.godot
          run_godot() {
            "$BENCH_GODOT" "$@" > "$temp/benchmark-$GITHUB_RUN_ID.log" 2>&1 || { tail -100 "$temp/benchmark-$GITHUB_RUN_ID.log"; return 1; }
            if grep -E 'SCRIPT ERROR:|Parse Error' "$temp/benchmark-$GITHUB_RUN_ID.log"; then return 1; fi
          }
          run_godot --headless --path Projeto-Godot --import
          a=$(date +%s)
          for script in res://mobile_controls.gd res://main.gd res://medieval_main_menu.gd res://game_updater.gd; do
            run_godot --headless --path Projeto-Godot --check-only --script "$script"
          done
          b=$(date +%s)
          run_godot --headless --path Projeto-Godot --export-debug 'Android LAN' "$apk"
          c=$(date +%s)
          test -s "$apk"
          if [ "$RUNNER_OS" = Windows ]; then
            java="$JAVA_HOME/bin/java.exe"
            jar="$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar"
            "$java" -jar "$jar" verify --verbose "$(cygpath -m "$apk")"
          else
            "$BENCH_SIGNER" verify --verbose "$apk"
          fi
          bytes=$(wc -c < "$apk")
          sha256sum "$apk"
          d=$(date +%s)
          {
            echo "## $RUNNER_NAME"
            echo "Commit: $(git rev-parse HEAD)"
            echo "| Etapa | Segundos |"
            echo "|---|---:|"
            echo "| Checkout | $checkout |"
            echo "| Importacao | $((a-start)) |"
            echo "| Validacao | $((b-a)) |"
            echo "| Exportacao APK | $((c-b)) |"
            echo "| Verificacao | $((d-c)) |"
            echo "| Total sem instalacao | $((d-BENCH_START)) |"
            echo "APK: $bytes bytes. Nenhuma release publicada."
          } | tee -a "$GITHUB_STEP_SUMMARY"
