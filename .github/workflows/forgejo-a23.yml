name: A23 - piloto Forgejo local
on:
  push:
    branches: [infra/forgejo-a23]
    paths: ['.github/workflows/forgejo-a23.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgejo-a23-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: [self-hosted, Linux, ARM64, a23]
    timeout-minutes: 20
    env:
      FORGEJO_VERSION: '15.0.12'
    steps:
      - name: Diagnostico de capacidade
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -u)" != 0
          for cmd in git curl apt-get dpkg-deb awk base64 grep; do command -v "$cmd"; done
          git --version
          df -h "$HOME"
          free -m || true
          test "$(df -Pk "$HOME" | awk 'NR==2 {print $4}')" -ge 2097152
          git lfs version || echo 'Git LFS pendente antes de migrar projetos LFS.'
      - name: Instalar binario oficial LTS e verificar assinatura
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base="$HOME/.local/share/forgejo-a23"
          mkdir -p "$base/bin"
          tmp="$(mktemp -d "$RUNNER_TEMP/forgejo-download.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          export GNUPGHOME="$tmp/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          # gpgv verifica assinaturas sem instalar pacotes no sistema.
          verifier="$(command -v gpgv || true)"
          if [ -z "$verifier" ]; then
            mkdir -p "$tmp/debs" "$tmp/native"
            (
              cd "$tmp/debs"
              apt-get -s --no-install-recommends install gpgv > plan
              packages="$( { printf '%s\n' gpgv; awk '/^Inst / {print $2}' plan; } | sort -u)"
              for pkg in $packages; do apt-get download "$pkg"; done
              for pkg in ./*.deb; do dpkg-deb -x "$pkg" "$tmp/native"; done
            )
            verifier="$tmp/native/usr/bin/gpgv"
            export LD_LIBRARY_PATH="$tmp/native/usr/lib/aarch64-linux-gnu:$tmp/native/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
          fi
          test -x "$verifier"
          "$verifier" --version
          asset="forgejo-$FORGEJO_VERSION-linux-arm64"
          url="https://code.forgejo.org/forgejo/forgejo/releases/download/v$FORGEJO_VERSION/$asset"
          curl -fLsS --retry 2 --max-time 240 "$url" -o "$tmp/forgejo"
          curl -fLsS --retry 2 --max-time 60 "$url.asc" -o "$tmp/forgejo.asc"
          fingerprint=EB114F5E6C0DC2BCDD183550A4B61A2DC5923710
          curl -fLsS --retry 2 --max-time 60 "https://keys.openpgp.org/vks/v1/by-fingerprint/$fingerprint" -o "$tmp/key.asc"
          awk '/^-----BEGIN PGP PUBLIC KEY BLOCK-----/ {active=1; next} /^-----END PGP PUBLIC KEY BLOCK-----/ {exit} active {sub(/\r$/, ""); if ($0 ~ /^[A-Za-z0-9+\/][A-Za-z0-9+\/=]*$/) print}' "$tmp/key.asc" | base64 -d > "$tmp/keyring.gpg"
          test -s "$tmp/keyring.gpg"
          "$verifier" --keyring "$tmp/keyring.gpg" --status-fd 1 "$tmp/forgejo.asc" "$tmp/forgejo" > "$tmp/verify.status"
          cat "$tmp/verify.status"
          awk -v f="$fingerprint" '$2=="VALIDSIG" && ($3==f || $NF==f) {ok=1} END {exit !ok}' "$tmp/verify.status"
          chmod 700 "$tmp/forgejo"
          "$tmp/forgejo" --version
          install -m 700 "$tmp/forgejo" "$base/bin/forgejo-$FORGEJO_VERSION"
          echo "FORGEJO_BIN=$base/bin/forgejo-$FORGEJO_VERSION" >> "$GITHUB_ENV"
      - name: Testar HTTP e SQLite apenas em localhost
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/forgejo-pilot.XXXXXX")"
          pid=''
          cleanup() {
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          port=$(( 20000 + RANDOM % 20000 ))
          if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "Porta local ocupada; teste interrompido"; exit 1; fi
          mkdir -p "$work/data" "$work/repos"
          cat > "$work/app.ini" <<EOF
          APP_NAME = Forgejo A23 piloto
          RUN_MODE = prod
          RUN_USER = $(id -un)
          [server]
          HTTP_ADDR = 127.0.0.1
          HTTP_PORT = $port
          ROOT_URL = http://127.0.0.1:$port/
          APP_DATA_PATH = $work/data
          DISABLE_SSH = true
          OFFLINE_MODE = true
          [database]
          DB_TYPE = sqlite3
          PATH = $work/data/forgejo.db
          [repository]
          ROOT = $work/repos
          [security]
          INSTALL_LOCK = true
          [service]
          DISABLE_REGISTRATION = true
          REQUIRE_SIGNIN_VIEW = true
          [actions]
          ENABLED = false
          [log]
          MODE = console
          LEVEL = Info
          EOF
          export FORGEJO_WORK_DIR="$work"
          "$FORGEJO_BIN" --work-path "$work" --config "$work/app.ini" web > "$work/server.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            if curl -fsS --max-time 2 "http://127.0.0.1:$port/user/login" > "$work/login.html" && grep -qi "Forgejo" "$work/login.html"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then tail -n 60 "$work/server.log"; exit 1; fi
          test -s "$work/data/forgejo.db"
          echo "Login HTTP 200 confirmado"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/v1/version")" = 403
          echo
          ps -p "$pid" -o pid,rss,etime
          df -h "$HOME"
          free -m || true
          echo 'FORGEJO_A23_PILOT_OK: binario instalado, HTTP e SQLite validados; instancia temporaria encerrada ao final.'
          echo 'Nenhum repositorio migrado, porta externa aberta ou runner existente alterado.'
      - name: Preparar armazenamento permanente e scripts locais
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base="$HOME/.local/share/forgejo-a23"
          mkdir -p "$base/data" "$base/repos" "$base/log"
          if [ ! -e "$base/app.ini" ]; then
            cat > "$base/app.ini" <<EOF
          APP_NAME = Servidor Git A23
          RUN_MODE = prod
          RUN_USER = $(id -un)
          [server]
          HTTP_ADDR = 127.0.0.1
          HTTP_PORT = 3000
          ROOT_URL = http://127.0.0.1:3000/
          APP_DATA_PATH = $base/data
          DISABLE_SSH = true
          OFFLINE_MODE = true
          [database]
          DB_TYPE = sqlite3
          PATH = $base/data/forgejo.db
          [repository]
          ROOT = $base/repos
          [security]
          INSTALL_LOCK = true
          [service]
          DISABLE_REGISTRATION = true
          REQUIRE_SIGNIN_VIEW = true
          [actions]
          ENABLED = false
          [log]
          MODE = console
          LEVEL = Info
          EOF
          fi
          chmod 600 "$base/app.ini"
          cat > "$base/start.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          cd "$(dirname "$0")"
          export FORGEJO_WORK_DIR="$PWD"
          exec ./bin/forgejo-15.0.12 --work-path "$PWD" --config "$PWD/app.ini" web
          EOF
          chmod 700 "$base/start.sh"
          if (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; then echo 'Porta 3000 ocupada, sem alterar processo existente'; exit 1; fi
          "$base/start.sh" >> "$base/log/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            if curl -fsS --max-time 2 http://127.0.0.1:3000/user/login > /dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          test -s "$base/data/forgejo.db"
          echo 'FORGEJO_PERSISTENT_DATA_OK; servidor temporariamente encerrado para validar reinicio'
          kill "$pid"; wait "$pid" || true
          "$base/start.sh" >> "$base/log/server.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            if curl -fsS --max-time 2 http://127.0.0.1:3000/user/login > /dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          test -s "$base/data/forgejo.db"
          echo 'FORGEJO_RESTART_OK; dados preservados, acesso local apenas.'
          # Nao deixar processo orfao em job PRoot; inicializacao 24h requer supervisor externo.
